[project]
name = "docparser"
version = "0.1.0"
description = "FastAPI-based document parsing service with OCR capabilities"
authors = [{name = "Samip Timalsena", email = "samip.timalsena@docsumo.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    # Document Processing
    "pypdf>=4.0.0,<5.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "python-docx>=1.1.0,<2.0.0",
    # OCR & Image Processing
    "Pillow>=10.2.0,<11.0.0",
    "numpy>=1.26.0,<3.0.0",
    "opencv-python>=4.9.0,<5.0.0",
    "PyMuPDF>=1.24.0,<2.0.0",
    # Cloud OCR Providers
    "boto3>=1.34.0,<2.0.0",
    "aioboto3>=13.0.0,<14.0.0",
    "google-cloud-vision>=3.7.0,<4.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    # Database & Storage
    "motor>=3.3.2,<4.0.0",
    "pymongo>=4.6.1,<5.0.0",
    # Utils
    "httpx>=0.26.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "tenacity>=8.2.0,<9.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # RAG & Chunking
    "llama-index-core>=0.14.13",
    # Embeddings & Vector DB
    "openai>=1.0.0,<2.0.0",
    "qdrant-client>=1.7.0,<2.0.0",
    # Hybrid Search
    "rank-bm25>=0.2.2,<1.0.0",
    # Re-ranking
    "sentence-transformers>=2.2.0,<3.0.0",
    # LLM
    "google-genai>=0.2.0,<1.0.0",  # Google Generative AI SDK for Gemini
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",

    # Code Quality
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "pre-commit>=3.6.0",

    # Development
    "ipython>=8.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
