# ─────────────────────────────────────────────────────────────────────────
# Mero Dafa — Plan Definitions
# ─────────────────────────────────────────────────────────────────────────
# Edit this file to change what each tier includes or limits.
# After editing, restart the backend for changes to take effect.
#
# Notes:
# - `id` is the stable key stored in the user document. Do NOT rename an `id`
#   without migrating users in the DB.
# - `-1` in any numeric limit means "unlimited".
# - `price_npr: null` means "contact sales" (no monthly price shown).
# - `default_plan` is assigned to newly registered users.
# ─────────────────────────────────────────────────────────────────────────

default_plan: starter

plans:
  - id: starter
    name: Free
    description: "20 questions / month \u00b7 3 private documents \u00b7 Public catalog only \u00b7 1 user"
    price_npr: 0
    period: monthly
    highlight: false
    order: 1
    limits:
      searches_per_day: 20          # treated as per-period cap in UI copy
      pdf_downloads_per_day: 3
      gazette_years: 2
      chat_history_days: 7
      max_starred_responses: 10
      api_access: false
    features:
      - 20 questions / month
      - 3 private documents
      - Public catalog only
      - 1 user

  - id: pro
    name: Professional
    description: "Unlimited questions \u00b7 50 private documents \u00b7 Up to 5 seats \u00b7 PDF viewer & citations"
    price_npr: 2500
    period: monthly
    highlight: true
    order: 2
    limits:
      searches_per_day: -1
      pdf_downloads_per_day: -1
      gazette_years: -1
      chat_history_days: -1
      max_starred_responses: 50
      api_access: false
    features:
      - Unlimited questions
      - 50 private documents
      - Up to 5 seats
      - PDF viewer & citations

  - id: firm
    name: Firm
    description: "Everything in Professional \u00b7 250 private documents \u00b7 Up to 25 seats \u00b7 Shared pinned & threads \u00b7 SSO & audit log"
    price_npr: 12500
    period: monthly
    highlight: false
    order: 3
    limits:
      searches_per_day: -1
      pdf_downloads_per_day: -1
      gazette_years: -1
      chat_history_days: -1
      max_starred_responses: 250
      api_access: false
    features:
      - Everything in Professional
      - 250 private documents
      - Up to 25 seats
      - Shared pinned & threads
      - SSO & audit log

  - id: enterprise
    name: Enterprise
    description: "Unlimited documents \u00b7 Unlimited seats \u00b7 Dedicated support \u00b7 On-prem option \u00b7 Custom SLA"
    price_npr: null                # contact sales
    period: custom
    highlight: false
    order: 4
    limits:
      searches_per_day: -1
      pdf_downloads_per_day: -1
      gazette_years: -1
      chat_history_days: -1
      max_starred_responses: -1
      api_access: true
    features:
      - Unlimited documents
      - Unlimited seats
      - Dedicated support
      - On-prem option
      - Custom SLA
